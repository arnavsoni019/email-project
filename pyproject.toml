[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailorg"
version = "0.1.0"
description = "Privacy-first agentic email organiser (local LLM by default, cloud opt-in)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Core dependencies: everything needed through Phase 3 (Gmail sync, local LLM, web UI).
dependencies = [
    # Web layer (Phase 3)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",   # parses HTMX/HTML form POSTs

    # LLM + agent orchestration (Phase 2/5) — LangChain v1 + LangGraph over local Ollama
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",     # local chat + embeddings via Ollama
    "langgraph>=1.0",            # agent loop + human-in-the-loop (propose->approve)
    "httpx>=0.27",               # direct Ollama health/version checks

    # Rendering sender HTML safely (Phase 3.5) — Rust "ammonia" bindings. Parses the
    # markup into a tree and rebuilds it from an allowlist, which regex stripping
    # cannot do reliably against deliberately malformed email.
    "nh3>=0.2",

    # Config + structured outputs
    "pydantic>=2.7",
    "pydantic-settings>=2.3",    # loads typed settings from .env

    # Gmail access (Phase 1)
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
]

[project.optional-dependencies]
# Phase 4 — semantic search / RAG with ChromaDB. Install with:  pip install -e ".[rag]"
rag = [
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
]
# Phase 6 — opt-in cloud LLM. Install with:  pip install -e ".[cloud]"
# OpenRouter, DeepSeek and most hosted providers expose an OpenAI-compatible API, so a
# single client covers all of them; which one is used is a base_url + model string in
# .env, not a code change.
cloud = [
    "langchain-openai>=1.0",
]
# Developer tooling. Install with:  pip install -e ".[dev]"
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mailorg"]

[tool.ruff]
line-length = 100
target-version = "py313"
